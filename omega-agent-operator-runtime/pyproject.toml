[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-agent-operator-runtime"
version = "0.1.0"
description = "Local-first runtime scaffold for OMEGA Agent Operator"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "typer>=0.12"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
omega = "omega_operator.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
