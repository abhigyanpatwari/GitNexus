name: PR cost evaluation request

on:
  pull_request_target:
    types: [labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  request:
    if: >-
      github.repository == 'abhigyanpatwari/GitNexus' &&
      github.event.label.name == 'run-cost-evaluation' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # pull_request_target uses trusted base code; never check out the PR here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Request one pinned comparison from trusted main
        working-directory: eval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m workflow_bench.pr_evaluation dispatch-label \
            --repo "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_PATH" >> "$GITHUB_STEP_SUMMARY"
