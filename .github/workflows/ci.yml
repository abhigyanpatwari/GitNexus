name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Concurrency convention: see CONTRIBUTING.md → "GitHub Actions — Concurrency Convention".
# Hardcoded `CI-` prefix (not `${{ github.workflow }}`) because this workflow is
# invoked as a reusable workflow from publish.yml. In called-workflow context
# `github.workflow` evaluation is ambiguous across GitHub Actions versions, and a
# prefix that could resolve to the caller's name would share a concurrency group
# with the caller → deadlock. A literal prefix is immune. Direct `pull_request`
# invocations use `CI-<ref>`; invocations from a reusable-workflow caller fall
# into a per-run-unique group that never serializes with the caller. `push` to
# main is handled by publish.yml (RC mode), which calls this workflow once
# before publishing.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('CI-{0}', github.ref) || format('CI-nested-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Reusable workflow orchestration ─────────────────────────────────
# Each concern lives in its own workflow file for maintainability:
#   ci-quality.yml       — formatting, lint and selected typechecks
#   ci-tests.yml         — affected PR suites and the full release matrix
#   ci-e2e.yml           — Chromium checks selected by the plan
#
# Shared setup is DRY via .github/actions/setup-gitnexus composite action.

jobs:
  plan:
    name: Select CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      checks: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: select
        with:
          retries: 2
          script: await require('./.github/scripts/ci-plan.cjs').plan({ github, context, core })

  quality:
    needs: plan
    uses: ./.github/workflows/ci-quality.yml
    with:
      plan: ${{ needs.plan.outputs.checks }}
    permissions:
      contents: read

  tests:
    needs: plan
    uses: ./.github/workflows/ci-tests.yml
    with:
      plan: ${{ needs.plan.outputs.checks }}
    permissions:
      contents: read
      actions: read

  sonar:
    name: SonarQube
    needs: [plan, tests]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && fromJSON(needs.plan.outputs.checks || '{}').run.quality
    uses: ./.github/workflows/sonarqube.yml
    with:
      packages: ${{ toJSON(fromJSON(needs.plan.outputs.checks).packages) }}
    permissions:
      actions: read
      contents: read
      id-token: write

  e2e:
    needs: plan
    uses: ./.github/workflows/ci-e2e.yml
    with:
      run-browser: ${{ fromJSON(needs.plan.outputs.checks).run.browser }}
    permissions:
      contents: read

  # ── Advisory duplicate-test scan ─────────────────────────────────
  # Comment-only: ci-report.yml renders this JSON into the sticky PR
  # comment. Kept out of `ci-status.needs` and marked continue-on-error,
  # so neither a finding nor a scanner crash can block a merge.
  # fetch-depth 2: HEAD is the PR merge commit, HEAD^1 the base tip.
  test-dupes:
    name: Duplicate test scan
    needs: plan
    if: github.event_name == 'pull_request' && fromJSON(needs.plan.outputs.checks).run.cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-gitnexus
        with:
          lifecycle-scripts: 'false'
      - name: Scan lines this PR changes
        run: npm run test:dupes -- --base HEAD^1 --json ../test-dupes/test-dupes.json
        working-directory: gitnexus
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-dupes
          path: test-dupes/
          retention-days: 1
          if-no-files-found: ignore

  # ── Save PR metadata for the reporting workflow ─────────────────
  # The ci-report.yml workflow (triggered by workflow_run) needs the
  # PR number and job results to post a comment.  We save them as an
  # artifact because workflow_run context doesn't reliably carry PR
  # info for fork PRs.
  save-pr-meta:
    name: Save PR Metadata
    if: always() && github.event_name == 'pull_request'
    needs: [plan, quality, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write metadata
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
          COUNTS: ${{ needs.tests.outputs.package-counts }}
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          E2E: ${{ needs.e2e.result == 'success' && !fromJSON(needs.plan.outputs.checks || '{}').run.browser && 'skipped' || needs.e2e.result }}
        run: |
          mkdir -p pr-meta
          echo "$COUNTS" > pr-meta/package_counts
          echo "$PR_NUMBER"      > pr-meta/pr_number
          echo "$QUALITY"        > pr-meta/quality_result
          echo "$TESTS"          > pr-meta/tests_result
          echo "$E2E"            > pr-meta/e2e_result
          # TODO(post-merge): remove backward-compat copies once ci-report.yml
          # on main reads underscore names.
          # Backward-compat: ci-report.yml on main still reads hyphenated
          # names.  workflow_run always executes from the default branch, so
          # the main-branch reader won't find the underscore variants until
          # this PR is merged.  Write both until then.
          cp pr-meta/pr_number       pr-meta/pr-number
          cp pr-meta/quality_result  pr-meta/quality-result
          cp pr-meta/tests_result    pr-meta/tests-result
          cp pr-meta/e2e_result      pr-meta/e2e-result

      - name: Upload PR metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-meta
          path: pr-meta/
          retention-days: 1

  # ── Unified CI gate ──────────────────────────────────────────────
  # Single required check for branch protection.
  ci-status:
    name: CI Gate
    needs: [plan, quality, tests, e2e, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          # The tree-sitter ABI gate (#1922) runs as the `abi-assert` job
          # inside the `tests` reusable workflow. A failed job fails the
          # reusable workflow, so `needs.tests.result` below blocks the merge
          # on an ABI mismatch. (`jobs.<id>.result` cannot be exposed as a
          # workflow_call output, so the gate is enforced transitively here.)
          # The scope-resolution resolver tests also run inside the `tests`
          # workflow (RING4-1 #942 removed the separate scope-parity gate),
          # so a resolver regression makes TESTS != success and blocks here.
          TESTS: ${{ needs.tests.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_REQUIRED: ${{ fromJSON(needs.plan.outputs.checks || '{}').run.browser }}
          SONAR: ${{ needs.sonar.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_AVAILABLE: ${{ needs.plan.outputs.checks != '' }}
          QUALITY_REQUIRED: ${{ fromJSON(needs.plan.outputs.checks || '{}').run.quality || fromJSON(needs.plan.outputs.checks || '{}').run.cli || fromJSON(needs.plan.outputs.checks || '{}').run.web || fromJSON(needs.plan.outputs.checks || '{}').run.workflows }}
          SONAR_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON(needs.plan.outputs.checks || '{}').run.quality }}
        run: |
          echo "Quality:        $QUALITY"
          echo "Tests:          $TESTS"
          echo "E2E:            $E2E"
          echo "SonarQube:      $SONAR"
          if [[ "$PLAN_RESULT" != success || "$PLAN_AVAILABLE" != true ]]; then
            echo "::error::Select CI checks finished with $PLAN_RESULT (plan available: $PLAN_AVAILABLE)."
            exit 1
          fi
          if [[ "$SONAR_REQUIRED" == true && "$SONAR" != success ]]; then
            echo "::error::SonarQube analysis was required and finished with $SONAR"
            exit 1
          fi
          # A failed `abi-assert` job (#1922) inside the tests reusable
          # workflow makes TESTS != success, so this clause also blocks the
          # merge on a tree-sitter ABI mismatch.
          if [[ "$QUALITY" != success && ( "$QUALITY_REQUIRED" == true || "$QUALITY" != skipped ) ]] ||
             [[ "$TESTS" != "success" ]]; then
            echo "::error::Quality or test jobs failed (includes the tree-sitter ABI gate, #1922)"
            exit 1
          fi
          if [[ "$E2E" != success && ( "$E2E_REQUIRED" == true || "$E2E" != skipped ) ]]; then
            echo "::error::E2E job failed"
            exit 1
          fi
