name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

# ── Reusable workflow orchestration ─────────────────────────────────
# Each concern lives in its own workflow file for maintainability:
#   ci-quality.yml       — typecheck (tsc --noEmit)
#   ci-unit-tests.yml    — unit tests with coverage + cross-platform
#   ci-integration.yml   — integration test matrix (3 OS x 4 groups)
#
# Shared setup is DRY via .github/actions/setup-gitnexus composite action.

jobs:
  quality:
    uses: ./.github/workflows/ci-quality.yml

  unit-tests:
    uses: ./.github/workflows/ci-unit-tests.yml

  integration:
    uses: ./.github/workflows/ci-integration.yml

  # ── PR test & coverage report ────────────────────────────────────
  # Downloads coverage artifacts from unit tests and posts a summary
  # comment on the PR with test results and coverage metrics.
  pr-report:
    name: PR Report
    if: always() && github.event_name == 'pull_request'
    needs: [quality, unit-tests, integration]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports
        continue-on-error: true

      - name: Build report
        id: report
        run: |
          # ── Coverage metrics ──
          COV_FILE="reports/gitnexus/coverage/coverage-summary.json"
          if [ -f "$COV_FILE" ]; then
            STMTS=$(jq -r '.total.statements.pct' "$COV_FILE")
            BRANCH=$(jq -r '.total.branches.pct' "$COV_FILE")
            FUNCS=$(jq -r '.total.functions.pct' "$COV_FILE")
            LINES=$(jq -r '.total.lines.pct' "$COV_FILE")
          else
            STMTS="N/A"; BRANCH="N/A"; FUNCS="N/A"; LINES="N/A"
          fi

          # ── Test counts ──
          RESULTS_FILE="reports/gitnexus/test-results.json"
          if [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(jq -r '.numTotalTests' "$RESULTS_FILE")
            PASSED=$(jq -r '.numPassedTests' "$RESULTS_FILE")
            FAILED=$(jq -r '.numFailedTests' "$RESULTS_FILE")
            SKIPPED=$(jq -r '.numPendingTests' "$RESULTS_FILE")
          else
            TOTAL="N/A"; PASSED="N/A"; FAILED="N/A"; SKIPPED="N/A"
          fi

          # ── Job status icons ──
          status_icon() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "skip" ;;
              *) echo "?" ;;
            esac
          }

          QUALITY="${{ needs.quality.result }}"
          UNIT="${{ needs.unit-tests.result }}"
          INTEG="${{ needs.integration.result }}"

          # ── Build markdown ──
          {
            echo "body<<REPORT_EOF"
            echo "## CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Typecheck | \`$(status_icon "$QUALITY")\` |"
            echo "| Unit Tests | \`$(status_icon "$UNIT")\` |"
            echo "| Integration Tests | \`$(status_icon "$INTEG")\` |"
            echo ""
            if [ "$TOTAL" != "N/A" ]; then
              echo "**Unit Tests:** ${PASSED}/${TOTAL} passed, ${FAILED} failed, ${SKIPPED} skipped"
              echo ""
            fi
            echo "### Code Coverage"
            echo ""
            echo "| Metric | Coverage |"
            echo "|--------|----------|"
            echo "| Statements | ${STMTS}% |"
            echo "| Branches | ${BRANCH}% |"
            echo "| Functions | ${FUNCS}% |"
            echo "| Lines | ${LINES}% |"
            echo ""
            echo "---"
            echo "[View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-report
          message: ${{ steps.report.outputs.body }}

  # ── Unified CI gate ──────────────────────────────────────────────
  # Single required check for branch protection.
  ci-status:
    name: CI Gate
    needs: [quality, unit-tests, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo "Quality:     ${{ needs.quality.result }}"
          echo "Unit Tests:  ${{ needs.unit-tests.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          if [[ "${{ needs.quality.result }}" != "success" ]] ||
             [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.integration.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
