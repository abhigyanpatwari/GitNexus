name: Quality Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    # Same root npm ci as lint. A cold install already took 4m19s here and
    # canceled prettier at the 5-minute job cap; lint needed 7m41s the same run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prettier --check .

  parse-cache-version:
    # Guards a collision no single-branch test can see: two PRs claiming the
    # same SCHEMA_BUMP both pass their own `toBe(N)` pin, then share one
    # PARSE_CACHE_VERSION after merge and one side's parse-time capture change
    # silently replays pre-change ParsedFiles forever. Ten ledger entries, four
    # exact clashes, every one caught by hand at merge time until now.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: the check reads the BASE branch's value, which a
          # shallow clone does not contain. The script exits 2 (distinct from a
          # real conflict) if the ref is unreachable, so a misconfiguration here
          # cannot masquerade as a pass.
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}" || git fetch --no-tags origin "${GITHUB_BASE_REF:-main}"
      - name: Compare SCHEMA_BUMP against the base branch
        env:
          GITNEXUS_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: node scripts/check-parse-cache-version.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx eslint .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # tsc --noEmit reads source + gitnexus-shared/dist. Skip prepare/postinstall
      # so a cold shared install cannot eat the 10-minute budget on a second tsc.
      - uses: ./.github/actions/setup-gitnexus
        with:
          lifecycle-scripts: 'false'
      - run: npx tsc --noEmit
        working-directory: gitnexus

  typecheck-web:
    runs-on: ubuntu-latest
    # Cold gitnexus-web npm ci is several minutes (mermaid/langchain/playwright).
    # A 10-minute cancel prevents setup-node from saving the cache, so the next
    # run is cold again.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gitnexus-web
      - run: npx tsc -b --noEmit
        working-directory: gitnexus-web

  # Enforces the convention documented in CONTRIBUTING.md → "GitHub Actions —
  # Concurrency Convention":
  #   1. Every entry-point (non-reusable) workflow declares a top-level
  #      `concurrency:` block.
  #   2. Reusable workflows (`on: workflow_call` only) do NOT declare one —
  #      they inherit concurrency from the caller.
  #   3. The concurrency group key starts with `${{ github.workflow }}` or
  #      the literal `CI-` prefix (the documented ci.yml exception for
  #      reusable-workflow-safe grouping).
  # Reusability is detected by parsing each workflow's `on:` block, not an
  # allowlist, so new reusable workflows never produce false positives.
  workflow-convention:
    name: Workflow concurrency convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate workflow concurrency convention
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-workflow-concurrency.py .github/workflows
