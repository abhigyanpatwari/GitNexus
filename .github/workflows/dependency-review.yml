name: Dependency Review

# Blocks PRs that introduce dependencies with high/critical known vulnerabilities.
# Reads the dependency graph diff between PR head and base.
#
# This is a required-check candidate after one week of clean runs
# (operator decision — see docs/plans/2026-05-03-001-feat-automated-security-scans-plan.md).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # pull-requests:write enables the inline summary comment on failure.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
