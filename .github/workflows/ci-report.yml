name: CI Report

# Triggered after the CI workflow completes.  Because workflow_run
# always runs code from the *default branch*, it receives a read/write
# GITHUB_TOKEN — even when the triggering PR comes from a fork.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  actions: read # needed to list/download workflow run artifacts
  pull-requests: write # needed to post sticky PR comment

# Concurrency convention: see CONTRIBUTING.md → "GitHub Actions — Concurrency Convention".
# Serialize sticky-comment writes per PR so two rapid CI completions don't race.
# Internal PRs surface in `pull_requests[0].number`. Fork PRs leave that array empty,
# so we fall back to `<head-repo-full-name>/<head-branch>`, which is stable across
# reruns and subsequent pushes for the same fork PR (unlike `workflow_run.id` which
# is unique per run and therefore does not serialize anything).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || format('{0}/{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: false

jobs:
  pr-report:
    name: PR Report
    # Only run for pull-request CI runs
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── Download artifacts from the CI run ────────────────────────
      - name: Download artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runId = context.payload.workflow_run.id;

            // Sharded CI runs can upload more than one page of artifacts.
            const allArtifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });

            async function downloadArtifact(name, dest) {
              const match = allArtifacts.find(a => a.name === name);
              if (!match) {
                core.warning(`Artifact "${name}" not found`);
                return false;
              }
              const zip = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: match.id,
                archive_format: 'zip',
              });
              fs.mkdirSync(dest, { recursive: true });
              fs.writeFileSync(path.join(dest, `${name}.zip`), Buffer.from(zip.data));
              return true;
            }

            const temp = process.env.RUNNER_TEMP;
            await downloadArtifact('pr-meta', path.join(temp, 'dl'));
            for (const name of ['test-reports', 'test-dupes']) {
              if (allArtifacts.some(a => a.name === name)) await downloadArtifact(name, path.join(temp, 'dl'));
            }

      - name: Extract artifacts
        shell: bash
        run: |
          # With no artifacts, let the metadata step skip the report cleanly.
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          # Extract each artifact into its own directory to avoid filename collisions
          for z in *.zip; do
            [ -f "$z" ] || continue
            name="${z%.zip}"
            mkdir -p "$RUNNER_TEMP/artifacts/$name"
            unzip -o "$z" -d "$RUNNER_TEMP/artifacts/$name"
          done

      - name: Read PR metadata
        id: meta
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/artifacts/pr-meta"
          if [ ! -f "$DIR/pr_number" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::pr_number artifact missing — skipping report"
            exit 0
          fi

          # Validate PR number is a positive integer (artifact comes from
          # untrusted fork code, so treat contents defensively).
          PR_NUM=$(tr -d '[:space:]' < "$DIR/pr_number")
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::error::Invalid PR number in artifact: '$PR_NUM'"
            exit 0
          fi

          # Validate job-result strings against known GitHub Actions values.
          # Artifact contents come from the PR workflow (potentially untrusted
          # fork code), so we whitelist to prevent newline injection into
          # GITHUB_OUTPUT.
          validate_result() {
            local val
            val=$(tr -d '[:space:]' < "$1")
            case "$val" in
              success|failure|cancelled|skipped) echo "$val" ;;
              *) echo "unknown" ;;
            esac
          }

          {
            echo "skip=false"
            echo "pr_number=$PR_NUM"
            echo "quality=$(validate_result "$DIR/quality_result")"
            echo "tests=$(validate_result "$DIR/tests_result")"
            echo "e2e=$(validate_result "$DIR/e2e_result")"
            counts=$(cat "$DIR/package_counts" 2>/dev/null || true)
            if [[ "$counts" =~ ^[0-9]{1,9}\ passed,\ [0-9]{1,9}\ skipped$ ]]; then
              echo "package_counts=$counts"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build report
        if: steps.meta.outputs.skip != 'true'
        id: report
        shell: bash
        env:
          QUALITY: ${{ steps.meta.outputs.quality }}
          TESTS: ${{ steps.meta.outputs.tests }}
          E2E: ${{ steps.meta.outputs.e2e }}
          COUNTS: ${{ steps.meta.outputs.package_counts }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          DIR="$RUNNER_TEMP/artifacts"

          # Failed shards can leave the run without a test-reports artifact.
          find_first() {
            local root=$1 name=$2
            [ -d "$root" ] || return 0
            find "$root" -name "$name" -type f 2>/dev/null | head -1 || true
          }

          # ── Locate test results ──
          RESULTS_FILE=$(find_first "$DIR/test-reports" "test-results.json")
          WEB_RESULTS_FILE=$(find_first "$DIR/test-reports" "web-test-results.json")
          PYTEST_RESULTS_FILE=$(find_first "$DIR/test-reports" "pytest-results.json")

          sum_results() {
            local file=$1
            if [ -n "$file" ] && [ -f "$file" ]; then
              jq -r '"\(.numTotalTests) \(.numPassedTests) \(.numFailedTests) \(.numPendingTests) \(.numTotalTestSuites) \(((.testResults | map(.endTime) | max) - (.startTime)) / 1000 | floor)"' "$file" 2>/dev/null || echo "0 0 0 0 0 0"
            else
              echo "0 0 0 0 0 0"
            fi
          }

          # `_` placeholder for the suite-count column — positional
          # readability for sum_results' 6-field output, but the value
          # isn't surfaced in the report (suites are tracked per-test
          # framework, not as a top-line metric).
          read -r CLI_T CLI_P CLI_F CLI_S _ CLI_D <<< "$(sum_results "$RESULTS_FILE")"
          read -r WEB_T WEB_P WEB_F WEB_S _ WEB_D <<< "$(sum_results "$WEB_RESULTS_FILE")"
          read -r PY_T PY_P PY_F PY_S _ PY_D <<< "$(sum_results "$PYTEST_RESULTS_FILE")"

          TOTAL=$((CLI_T + WEB_T + PY_T))
          PASSED=$((CLI_P + WEB_P + PY_P))
          FAILED=$((CLI_F + WEB_F + PY_F))
          SKIPPED=$((CLI_S + WEB_S + PY_S))
          DURATION=$((CLI_D > WEB_D ? CLI_D : WEB_D))
          DURATION=$((DURATION > PY_D ? DURATION : PY_D))
          EXECUTION_ERRORS=0
          for rf in "$RESULTS_FILE" "$WEB_RESULTS_FILE" "$PYTEST_RESULTS_FILE"; do
            if [ -n "$rf" ] && [ -f "$rf" ]; then
              errors=$(jq -r '(.executionFailures // []) | length' "$rf")
              EXECUTION_ERRORS=$((EXECUTION_ERRORS + errors))
            fi
          done

          # ── Status helpers ──
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled|skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          # ── Overall status ──
          if [[ ("$QUALITY" == "success" || "$QUALITY" == "skipped") && "$TESTS" == "success" && ("$E2E" == "success" || "$E2E" == "skipped") ]]; then
            OVERALL="✅ **Quality, tests and applicable E2E checks passed**"
          else
            OVERALL="❌ **Quality, tests or E2E checks failed or did not finish**"
          fi

          # ── Build markdown ──
          {
            echo "body<<GITNEXUS_CI_REPORT_EOF_7f3a"
            echo "## CI Report"
            echo ""
            echo "${OVERALL}"
            echo ""
            echo "### Pipeline Status"
            echo ""
            echo "| Stage | Status | Details |"
            echo "|-------|--------|---------|"
            echo "| $(status_icon "$QUALITY") Quality | \`${QUALITY}\` | Formatting, lint and selected typechecks |"
            echo "| $(status_icon "$TESTS") Tests | \`${TESTS}\` | Suites selected for this PR${COUNTS:+. Linux package tests: $COUNTS} |"
            echo "| $(status_icon "$E2E") E2E | \`${E2E}\` | Chromium for affected web or backend changes |"
            echo ""

            if [ "$TOTAL" -gt 0 ] 2>/dev/null; then
              echo "### Test Results"
              echo ""
              echo "| Tests | Passed | Failed | Unverified | Duration |"
              echo "|-------|--------|--------|---------|----------|"
              echo "| ${TOTAL} | ${PASSED} | ${FAILED} | ${SKIPPED} | ${DURATION}s |"
              echo ""

              if [[ "$FAILED" == "0" && "$SKIPPED" == "0" && "$EXECUTION_ERRORS" == "0" && "$TESTS" == "success" ]]; then
                echo "✅ All **${PASSED}** tests passed"
              else
                echo "❌ Test execution is incomplete or failed: **${FAILED}** failed, **${SKIPPED}** unverified, **${EXECUTION_ERRORS}** runner/suite errors."
              fi
              if [ "$SKIPPED" != "0" ]; then
                echo ""
                echo "<details>"
                echo "<summary>${SKIPPED} test(s) have no recorded pass — expand for details</summary>"
                echo ""
                for rf in "$RESULTS_FILE" "$WEB_RESULTS_FILE" "$PYTEST_RESULTS_FILE"; do
                  if [ -n "$rf" ] && [ -f "$rf" ]; then
                    jq -r '
                      .testResults[]
                      | .assertionResults[]?
                      | select(.status == "pending" or .status == "skipped")
                      | "- \(.ancestorTitles | join(" > ")) > \(.title)"
                    ' "$rf" 2>/dev/null || true
                  fi
                done
                echo ""
                echo "</details>"
              fi
              echo ""
            fi

            # ── Possible duplicate tests (advisory, ci.yml test-dupes job) ──
            # The JSON is produced by PR code, so only whitelisted kinds and
            # strict path/line shapes reach the comment; free text is dropped.
            DUPES_FILE=$(find_first "$DIR/test-dupes" "test-dupes.json")
            if [ -n "$DUPES_FILE" ]; then
              jq -r '
                def path_ok: type == "string" and test("\\A[A-Za-z0-9._/@+-]{1,300}\\z");
                def line_ok: type == "number" and . >= 1 and . <= 1000000 and floor == .;
                def loc: "`\(.file):\(.line)`";
                [ .findings[]?
                  | select(.kind | IN("same-test", "assertions-pinned", "same-fixture-setup", "copied-helper", "orphan-bench-gate"))
                  | select((.file | path_ok) and (.line | line_ok))
                  | .matches = ([(.matches // [])[]? | select((.file | path_ok) and (.line | line_ok))][:3])
                ]
                | if length == 0 then empty else
                    "### Possible duplicate tests",
                    "",
                    "Advisory only, never blocks merge: \(length) finding(s) on lines this PR changes. Run `npm run test:dupes` in `gitnexus/` for details; mark an intentional repeat with `// dupe-ok: <reason>`.",
                    "",
                    "| Kind | Changed | Already at |",
                    "|------|---------|------------|",
                    (.[:20][] | "| `\(.kind)` | \(loc) | \(if (.matches | length) == 0 then "no workflow runs it" else (.matches | map(loc) | join("<br>")) end) |"),
                    (if length > 20 then "", "…and \(length - 20) more." else empty end),
                    ""
                  end
              ' "$DUPES_FILE" 2>/dev/null || true
            fi

            echo "---"
            echo "<sub>📋 [View full run](${RUN_URL}) · Generated by CI</sub>"
            echo "GITNEXUS_CI_REPORT_EOF_7f3a"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.meta.outputs.skip != 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: ci-report
          number: ${{ steps.meta.outputs.pr_number }}
          message: ${{ steps.report.outputs.body }}
