name: Setup GitNexus
description: Setup Node.js 22, install dependencies, and optionally build

inputs:
  build:
    description: Whether to run npm run build after install
    required: false
    default: 'false'
  lifecycle-scripts:
    description: >
      Run npm lifecycle scripts (prepare/postinstall) during gitnexus npm ci.
      Typecheck-only and pack-only jobs should set this to false: they do not
      need dist/ or native grammar builds, and those scripts are what blow a
      10-minute job after a cold gitnexus-shared install.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22
        cache: npm
        # Key on the CLI lockfile only. A combined hash with gitnexus-shared
        # busts the large cached tree whenever the tiny shared lockfile changes.
        cache-dependency-path: gitnexus/package-lock.json

    - name: Build gitnexus-shared
      run: npm ci && npm run build
      shell: bash
      working-directory: gitnexus-shared

    - name: Install dependencies
      if: ${{ inputs.lifecycle-scripts != 'false' }}
      run: npm ci
      shell: bash
      working-directory: gitnexus

    - name: Install dependencies
      if: ${{ inputs.lifecycle-scripts == 'false' }}
      run: npm ci --ignore-scripts
      shell: bash
      working-directory: gitnexus

    - name: Build
      if: ${{ inputs.build == 'true' }}
      run: npm run build
      shell: bash
      working-directory: gitnexus
