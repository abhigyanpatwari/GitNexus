name: Require paired agent release evidence
description: Verify fresh agent evidence for the checked out commit and current task pins

runs:
  using: composite
  steps:
    - name: Setup locked evaluation validator
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.11.23'
        python-version: '3.13'
        # Publishing must not restore caches populated by other runs.
        enable-cache: false
    - name: Require paired evidence for this exact commit
      shell: bash
      working-directory: eval
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        uv run --locked --extra dev python -m workflow_bench.release_evidence \
          --repo "$GITHUB_REPOSITORY" --runtime-sha "$(git rev-parse HEAD)" \
          --out "$RUNNER_TEMP/release-evidence"
