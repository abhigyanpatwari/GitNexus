name: Setup GitNexus Web
description: Setup Node.js 22, build gitnexus-shared, install web dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        # Vite 7 requires Node ^20.19.0 || >=22.12.0 (require(esm) support).
        node-version: 22
        cache: npm
        # Key on the web lockfile only. Adding gitnexus-shared here changes the
        # cache hash, forces a cold ~650-package install, and a 10-minute job
        # cancels before setup-node can save the new cache.
        cache-dependency-path: gitnexus-web/package-lock.json

    - name: Build gitnexus-shared
      run: npm ci && npm run build
      shell: bash
      working-directory: gitnexus-shared

    - name: Install web dependencies
      run: npm ci
      shell: bash
      working-directory: gitnexus-web
      env:
        # Browsers are installed explicitly by e2e. Typecheck only needs types.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
