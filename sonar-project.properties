sonar.organization=abhigyanpatwari
sonar.projectKey=abhigyanpatwari_GitNexus
# A full main-branch report is ~35 MB. The HTTP client caps a request at the
# shorter of the socket timeout and the remaining response deadline.
sonar.scanner.socketTimeout=180
sonar.scanner.responseTimeout=180
# The combined LCOV paths resolve from the repository root. Autoconfiguration
# also creates an eval module that tries to import the report from eval/coverage.
sonar.scanner.autoconfig.enabled=false
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.version=>=3.11

# Keep GitNexus's grammar loaders and build definitions in scope. The parser
# sources, native bindings below, and Leiden implementations come from upstream.
sonar.exclusions=\
  **/fixtures/**,\
  **/__snapshots__/**,\
  gitnexus/vendor/tree-sitter-*/src/**,\
  gitnexus/vendor/tree-sitter-*/grammar.js,\
  gitnexus/vendor/tree-sitter-*/bindings/node/binding.cc,\
  gitnexus/vendor/**/prebuilds/**,\
  gitnexus/vendor/**/*.wasm,\
  gitnexus/prebuilds/**,\
  gitnexus/vendor/leiden/**,\
  gitnexus-web/src/vendor/leiden/*.js,\
  gitnexus/bench/**/results/**,\
  Documentation/docs-asset/*.png,\
  .history/**

# The LCOV producers instrument gitnexus/src and gitnexus-web/src. Keep
# tooling, other packages and the Vitest exclusions in issue analysis only.
sonar.coverage.exclusions=\
  **/test/**,**/tests/**,**/*.test.*,**/*.spec.*,**/test_*.py,**/*.d.ts,\
  .claude/**,.devcontainer/**,.github/**,.husky/**,deploy/**,eslint-rules/**,eval/**,\
  gitnexus-*-plugin/**,gitnexus-cursor-integration/**,gitnexus-shared/**,gitnexus-test-setup/**,\
  docker-server.mjs,eslint.config.mjs,gitnexus/vitest.config.ts,gitnexus-web/*.config.ts,\
  gitnexus/bench/**,gitnexus/hooks/**,gitnexus/scripts/**,gitnexus/skills/**,gitnexus/tools/**,gitnexus/vendor/**,\
  gitnexus/src/cli/index.ts,gitnexus/src/core/wiki/**,\
  gitnexus-web/e2e/**,gitnexus-web/src/workers/**,gitnexus-web/src/core/lbug/**,\
  gitnexus-web/src/core/tree-sitter/**,gitnexus-web/src/core/embeddings/**,gitnexus-web/src/main.tsx

# The five plugin helpers are also exempt from duplication reporting. Their
# sync tests enforce byte equality with the copies in gitnexus/hooks/claude.
sonar.cpd.exclusions=\
  **/test/**,**/tests/**,gitnexus-web/e2e/**,**/*.test.*,**/*.spec.*,**/test_*.py,\
  gitnexus-cursor-integration/hooks/hook-lock.cjs,\
  gitnexus-cursor-integration/hooks/registry-query.cjs,\
  gitnexus-factory-plugin/hooks/hook-lock.js,\
  gitnexus-factory-plugin/hooks/registry-query.cjs,\
  gitnexus-factory-plugin/hooks/hook-db-lock-probe.cjs
