sonar.organization=abhigyanpatwari
sonar.projectKey=abhigyanpatwari_GitNexus

# Tests live both in suites and alongside application code. The scanner also
# applies test inclusions as source exclusions, so each file is indexed once.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test/**,**/tests/**,gitnexus-web/e2e/**,**/*.test.*,**/*.spec.*,**/test_*.py
sonar.test.exclusions=**/fixtures/**,**/__snapshots__/**

# Keep GitNexus's grammar loaders and build definitions in scope. The parser
# sources, native bindings below, and Leiden implementations come from upstream.
sonar.exclusions=\
  **/fixtures/**,\
  **/__snapshots__/**,\
  gitnexus/vendor/tree-sitter-*/src/**,\
  gitnexus/vendor/tree-sitter-*/grammar.js,\
  gitnexus/vendor/tree-sitter-*/bindings/node/binding.cc,\
  gitnexus/vendor/**/prebuilds/**,\
  gitnexus/prebuilds/**,\
  gitnexus/vendor/leiden/**,\
  gitnexus-web/src/vendor/leiden/*.js,\
  gitnexus/bench/**/results/**,\
  .history/**

# The plugin packages ship copies of the CLI hook helpers. Their sync tests
# enforce byte equality. Keep issue analysis on each copy and count duplication
# at the canonical implementation in gitnexus/hooks/claude.
sonar.cpd.exclusions=\
  gitnexus-cursor-integration/hooks/hook-lock.cjs,\
  gitnexus-cursor-integration/hooks/registry-query.cjs,\
  gitnexus-factory-plugin/hooks/hook-lock.js,\
  gitnexus-factory-plugin/hooks/registry-query.cjs,\
  gitnexus-factory-plugin/hooks/hook-db-lock-probe.cjs
